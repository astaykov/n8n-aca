# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: n8n-aca
metadata:
  template: n8n-aca
infra:
  provider: bicep
  path: infra
  module: main
  target: subscription

services:
  # Test SPA: static files in test-spa/, deployed to an Azure Static Web App.
  # authConfig.js is generated by the postprovision hook before `azd deploy spa` runs.
  spa:
    project: ./test-spa
    dist: .
    language: js
    host: staticwebapp
    resourceId: ${SWA_RESOURCE_ID}

workflows:
  up:
    steps:
      - azd: provision

hooks:
  postprovision:
    # Runs automatically after `azd provision`.
    # Configures Entra Agent ID objects and deploys credentials + workflows to n8n.
    # Reads N8N_URL and ENTRA_TENANT_ID from azd environment (set by Bicep outputs).
    shell: pwsh
    run: ./scripts/postprovision.ps1
    interactive: true
